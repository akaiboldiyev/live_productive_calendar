name: Publish Goal Dots release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore the stable release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 release secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goal-dots-release.jks"

      - name: Test and build the signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/goal-dots-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || { echo "Missing signing password secret"; exit 1; }
          gradle :app:testDebugUnitTest --tests com.example.GoalProgressCalculatorTest --tests com.example.WallpaperBackgroundRendererTest --tests com.example.WallpaperScheduleTest --tests com.example.OverlayReadabilityRendererTest --no-daemon
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Goal-Dots.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "Android apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/Goal-Dots.apk"

      - name: Publish the one user-facing APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/Goal-Dots.apk" --title "Goal Dots ${TAG#v}" --generate-notes
